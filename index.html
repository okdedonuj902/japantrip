<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFCF6">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="東京旅遊">
<title>東京旅遊</title>
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--sun:#F6D27A;--aqua:#A8D3E6;--leaf:#B9DAA5;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{background:var(--paper);color:var(--ink);font:16px/1.65 "Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button{font:inherit;color:var(--ink);cursor:pointer}
nav{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:8px;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--paper);border-bottom:3px solid var(--ink)}
nav a{flex:1;max-width:110px;text-align:center;padding:5px 0;border:3px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:800;background:var(--paper)}
nav a.on{background:var(--c)}
.ib{display:flex;align-items:center;justify-content:center;flex:none;width:44px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font-size:18px;line-height:1;padding:0}
#up{font-weight:800;font-size:20px}
body.edit #gear{background:var(--sun)}
main{max-width:720px;margin:0 auto;padding:calc(76px + env(safe-area-inset-top,0px)) 14px 28px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:16px;box-shadow:0 4px 0 var(--ink);margin:14px 0;min-width:0;overflow-wrap:anywhere}
h1{font-size:28px;line-height:1.3;text-align:center;margin:12px 0 2px}
h2{font-size:22px;margin:28px 4px 0}
h3{font-size:17px;margin-bottom:6px}
.sub,.ctr{text-align:center}.sub{font-weight:700}
.mut{color:#6b6462;font-size:13px;line-height:1.5;margin-top:3px}
.hero svg{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:20px}
.cd{display:flex;gap:8px;margin:12px 0 4px}
.cd div{flex:1;border:3px solid var(--ink);border-radius:18px;padding:4px 0;text-align:center;background:var(--c);font-weight:700}
.cd b{display:block;font-size:28px;line-height:1.3}
.tk .tkh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tkh .mut{margin:0 0 0 auto}
.pill,.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;font-weight:800;background:var(--c)}
.tag{margin:6px 6px 0 0;padding:0 9px;font-size:12px}
.fl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;line-height:1.4}
.fl b{font-size:26px}
.ar hr{border:0;border-top:3px dashed var(--ink);width:56px;margin:4px 0}
.kv{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:2px dotted var(--ink)}
.kv:last-child{border:0}
.kv .k{font-weight:800;flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.kv .k small{display:block;font-weight:400;overflow-wrap:anywhere}
.kv .v{flex:0 1 55%;min-width:0;margin-left:auto;text-align:right;overflow-wrap:anywhere}
.kv .v.amt{flex:none;white-space:nowrap}
.kv .eb{flex:none}
.kv.in{padding-left:18px}
.ch{display:flex;align-items:flex-start;gap:8px}
.ch h3{flex:1;min-width:0;overflow-wrap:anywhere}
.pi{padding:8px 0;border-bottom:2px dotted var(--ink)}
.pi.in{padding-left:18px}
.pt{display:flex;align-items:flex-start;gap:8px}
.pt b{flex:1;min-width:0;overflow-wrap:anywhere}
.pi p{margin-top:2px;font-size:15px;overflow-wrap:anywhere;white-space:pre-line}
.pl{display:inline-block;margin:8px 8px 0 0;padding:1px 11px;border:3px solid var(--ink);border-radius:999px;background:var(--aqua);color:var(--ink);font-size:13px;font-weight:700;text-decoration:none}
.pl.lk{background:var(--sun)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 8px;scroll-snap-type:x proximity}
.tab{flex:none;min-width:62px;scroll-snap-align:center;border:3px solid var(--ink);border-radius:18px;background:var(--paper);padding:4px 10px;text-align:center;line-height:1.3}
.tab small{display:block;font-size:12px}
.tab.on{background:var(--sun);animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.dh{margin-top:6px;font-weight:800;background:var(--leaf)}
.tl{list-style:none;padding:0;margin-top:18px}
.tl li{position:relative;padding:0 0 16px 92px;animation:drop .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*60ms)}
.tl li::before{content:"";position:absolute;left:65px;top:10px;width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;background:var(--c);z-index:1}
.tl li::after{content:"";position:absolute;left:70px;top:24px;bottom:-10px;border-left:3px solid var(--ink)}
.tl li:last-child::after{display:none}
.t{position:absolute;left:0;width:56px;text-align:right;font-weight:800;font-size:14px;line-height:1.3;padding-top:7px}
.t small{display:block;font-weight:400;color:#6b6462;font-size:12px}
.b{border:3px solid var(--ink);border-radius:18px;padding:9px 12px;background:var(--paper);overflow-wrap:anywhere}
.ti{font-weight:800}
.total{background:var(--coral);text-align:center;font-weight:800}
.total small{display:block;font-size:14px}
.total b{display:block;font-size:34px;line-height:1.3}
.total b.sm{font-size:22px}
.total .mut{color:var(--ink);font-weight:400}
[hidden]{display:none!important}
/* 記帳 */
.xf>label,.xl{display:block;font-weight:800;font-size:14px;margin-top:12px}
.xf>label:first-child{margin-top:0}
.xf input:not([type=radio]),.xf select{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;margin-top:4px}
.xbtn{display:block;width:100%;margin-top:14px;font:inherit;font-weight:800;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:6px;background:var(--leaf);cursor:pointer}
.xbtn.xcancel{background:var(--paper);margin-top:8px}
.xd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;font-weight:800;margin:18px 6px 0}
.xd span:last-child{font-size:14px}
.xc{margin-top:6px;padding:4px 14px}
.xe{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:2px dotted var(--ink)}
.xe:last-child{border:0}
.xe .xi{flex:1;min-width:0}
.xe .xn{font-weight:800;overflow-wrap:anywhere}
.xe .xa{font-size:14px;color:#6b6462}
.xe .eb{margin:0 0 0 4px}
footer{text-align:center;padding:10px 0 30px}
/* 編輯模式 */
.ed{display:none!important}
body.edit .ed{display:inline-flex!important}
body.edit .tab.ed,body.edit .add.ed{display:block!important}
.eb{border:2px solid var(--ink);border-radius:999px;background:var(--sun);font-size:12px;font-weight:800;padding:0 10px;margin-left:6px;line-height:1.7}
.ctl{justify-content:flex-end;gap:6px;margin-bottom:4px}
.ctl .eb{margin:0}
.add{width:100%;margin-top:10px;border:3px dashed var(--ink);border-radius:18px;background:var(--paper);padding:6px;font-weight:800}
.tab.add{width:auto;margin:0;flex:none}
/* 對話框 */
dialog{border:3px solid var(--ink);border-radius:26px;background:var(--paper);color:var(--ink);padding:14px;box-sizing:border-box;width:calc(100vw - 24px);max-width:520px;max-height:calc(100dvh - 24px);overflow-x:hidden;overflow-y:auto;box-shadow:0 4px 0 var(--ink);margin:auto}
dialog::backdrop{background:rgba(62,58,57,.45)}
dialog label{display:block;font-weight:800;font-size:14px;margin-top:10px}
dialog input:not([type=checkbox]),dialog textarea,dialog select{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;margin-top:4px}
dialog textarea{min-height:68px;resize:vertical}
.pls{counter-reset:pl}
.plr{counter-increment:pl;border:3px solid var(--ink);border-radius:18px;padding:6px 12px 12px;margin-top:10px}
.plh{display:flex;justify-content:space-between;align-items:center}
.plh b::before{content:"地點 " counter(pl)}
.plh .eb{margin:0}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk label{position:relative;margin:0;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700;cursor:pointer}
.chk input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chk label:has(input:checked){background:var(--c)}
.chk label:has(:focus-visible){outline:3px solid var(--ink);outline-offset:3px}
.bar{display:flex;gap:8px;margin-top:16px}
.bar button{flex:1;font-weight:800;border:3px solid var(--ink);border-radius:999px;padding:5px;background:var(--leaf)}
.bar .no{background:var(--paper)}.bar .del{background:var(--coral)}
.sw{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:800}
.sw input{width:22px;height:22px;accent-color:#3E3A39}
.note{font-size:13px;color:#6b6462;margin-top:8px;line-height:1.5}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(26px);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:none;opacity:1}}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(400px)}}
@keyframes roll{from{transform:translateX(-200px)}to{transform:translateX(300px)}}
@keyframes twinkle{50%{transform:scale(1.18) rotate(12deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rod{0%,100%{transform:translate(-3px,0)}25%{transform:translate(0,-3px)}50%{transform:translate(3px,0)}75%{transform:translate(0,3px)}}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.95}100%{transform:translate(-20px,-28px) scale(1.3);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes float{50%{transform:translateX(14px)}}
.plane{animation:drift 15s linear infinite}
.train{animation:roll 14s linear infinite}
.star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.rays{transform-origin:50px 50px;animation:spin 30s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
.rod{animation:rod .9s linear infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 2.4s ease-out infinite}
.cloud.c2{animation-duration:9s;animation-delay:-3s}
.cloud.c3{animation-duration:11s;animation-delay:-5s}
.cloud.c4{animation-duration:8s;animation-delay:-2s}
.sun{animation:bob 4s ease-in-out infinite}
.cloud{animation:float 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

async function xPut(r) {
  if (!fb) return xmsg('已記在這支手機（尚未設定雲端同步）');
  try { await fb.setDoc(fb.doc(fb.db, 'expenses', r.id), { d: r.d, jpy: r.jpy, twd: r.twd, name: r.name, pay: r.pay, ts: r.ts }); xmsg('已儲存並同步 ✓'); }
  catch (e) { xmsg(e.code == 'permission-denied' ? '雲端不允許寫入記帳：請到 Firebase 更新 Firestore 規則' : '同步失敗，已先存在這支手機'); }
}
async function xDel(id) {
  if (!fb) return;
  try { await fb.deleteDoc(fb.doc(fb.db, 'expenses', id)); xmsg('已刪除並同步 ✓'); }
  catch (e) { xmsg(e.code == 'permission-denied' ? '雲端不允許刪除記帳：請到 Firebase 更新 Firestore 規則' : '同步失敗，已先在這支手機刪除'); }
}
function xReset() {
  xEdit = null;
  X('xj').value = X('xt').value = X('xn').value = '';
  X('xsub').textContent = '＋ 新增記帳'; X('xcan').hidden = true;
}
$('#exp').innerHTML = `<h2>🧾 旅行記帳</h2>
<form class="card xf" id="xf" autocomplete="off">
<label>日期<select id="xd"></select></label>
<div class="xl">付款方式</div>
<div class="chk"><label style="--c:var(--leaf)"><input type="radio" name="pay" value="現金" checked>現金</label><label style="--c:var(--aqua)"><input type="radio" name="pay" value="刷卡">刷卡</label></div>
<label>品項名稱<input id="xn" placeholder="例如：午餐拉麵" maxlength="60" required></label>
<label>日幣 ¥（當下的日幣金額）<input id="xj" inputmode="numeric" placeholder="例如 1200"></label>
<label>台幣 NT$（刷卡實際扣款）<input id="xt" inputmode="numeric" placeholder="例如 252，沒有就留空"></label>
<p class="mut" id="xmsg"></p>
<button type="submit" class="xbtn" id="xsub">＋ 新增記帳</button>
<button type="button" class="xbtn xcancel" id="xcan" hidden>取消修改</button>
</form><div id="xlist"></div>`;
fillDates();
// 點「記帳」直接跳過去，不要慢慢滑
document.querySelector('nav a[href="#exp"]').addEventListener('click', e => {
  e.preventDefault();
  const root = document.documentElement, prev = root.style.scrollBehavior;
  root.style.scrollBehavior = 'auto'; X('exp').scrollIntoView(); root.style.scrollBehavior = prev;
});
X('xcan').onclick = () => { xReset(); xmsg(''); };
X('xf').addEventListener('submit', e => {
  e.preventDefault();
  const j = num(X('xj').value), t = num(X('xt').value), name = X('xn').value.trim();
  if (!j && !t) return xmsg('請輸入日幣或台幣金額');
  if (!name) return xmsg('請輸入品項名稱');
  const old = exp.find(x => x.id == xEdit);
  const rec = { id: old ? old.id : Date.now().toString(36) + Math.random().toString(36).slice(2, 6), d: X('xd').value, jpy: j, twd: t, name, pay: document.querySelector('#xf input[name=pay]:checked').value, ts: old ? old.ts : Date.now() };
  if (old) Object.assign(old, rec, { s: old.s }); else exp.push(rec);
  saveExp(); renderExp(); xPut(rec);
  xReset(); X('xj').focus();
});
$('#xlist').addEventListener('click', e => {
  const b = e.target.closest('[data-x]'); if (!b) return;
  const [a, id] = b.dataset.x.split(','), r = exp.find(x => x.id == id); if (!r) return;
  if (a == 'd') { if (!confirm(`刪除「${r.name}」這筆記帳嗎？`)) return; exp = exp.filter(x => x.id != id); saveExp(); renderExp(); xDel(id); return; }
  xEdit = id;
  if (![...X('xd').options].some(o => o.value == r.d)) X('xd').insertAdjacentHTML('beforeend', `<option value="${esc(r.d)}">${esc(r.d)}</option>`);
  X('xd').value = r.d; X('xj').value = r.jpy || ''; X('xt').value = r.twd || ''; X('xn').value = r.name;
  document.querySelector(`#xf input[name=pay][value="${r.pay}"]`).checked = true;
  X('xsub').textContent = '💾 儲存修改'; X('xcan').hidden = false; xmsg('正在修改這一筆');
  X('xf').scrollIntoView({ behavior: RM.matches ? 'auto' : 'smooth', block: 'center' });
});
function renderExp() {
  const L = $('#xlist'); if (!L) return;
  if (!exp.length) { L.innerHTML = '<div class="card ctr mut">還沒有記帳紀錄，記下第一筆吧！</div>'; return; }
  const sum = (a, k) => a.reduce((s, x) => s + (Number(x[k]) || 0), 0);
  const by = {}; exp.forEach(x => (by[x.d] = by[x.d] || []).push(x));
  const amt = x => [x.jpy ? yen(x.jpy) : '', x.twd ? twd(x.twd) : ''].filter(Boolean).join('　');
  L.innerHTML = `<div class="card total"><small>目前總花費（日幣）</small><b>${yen(sum(exp, 'jpy'))}</b></div>`
    + Object.keys(by).sort().reverse().map(d => {
      const a = by[d].slice().sort((p, q) => q.ts - p.ts), [y, m, dd] = d.split('-').map(Number);
      return `<div class="xd"><span>${m}/${dd}（${WD[new Date(y, m - 1, dd).getDay()]}）</span><span>${yen(sum(a, 'jpy'))}</span></div><div class="card xc">${a.map(x => `<div class="xe"><div class="xi"><div class="xn">${esc(x.name)} <span class="tag" style="--c:var(--${x.pay == '刷卡' ? 'aqua' : 'leaf'})">${esc(x.pay)}</span></div><div class="xa">${esc(amt(x))}</div></div><button class="eb" type="button" data-x="e,${esc(x.id)}" aria-label="修改">✎</button><button class="eb" type="button" data-x="d,${esc(x.id)}" aria-label="刪除">✕</button></div>`).join('')}</div>`;
    }).join('');
}
renderExp();

render();
initCloud();
if (!FIREBASE.projectId) setStatus('尚未設定雲端同步，修改只會存在這支手機');

// 選單隨捲動高亮
const links = [...document.querySelectorAll('nav a')];
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && links.forEach(a => a.classList.toggle('on', a.hash == '#' + e.target.id))), { rootMargin: '-35% 0px -60% 0px' });
['flight', 'days', 'prep', 'exp'].forEach(id => io.observe($('#' + id)));
</script>
</body>
</html>
